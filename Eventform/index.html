<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Event Form">
    <meta name="author" content="Efrain Velasquez">
    <title>Event Form</title>
    <link rel="icon" href="favicon.ico">
    <link rel="stylesheet" href="style.css">
    <script src="form.js" defer></script>
</head>
<body>
    <main class="wrapper">
    <h1>Event Ticket</h1>

<form id="eventForm"> <div class="field">
        <label for="firstName">First Name</label>
        <input id="firstName" name="firstName" type="text" required />
      </div>

      <div class="field">
        <label for="lastName">Last Name</label>
        <input id="lastName" name="lastName" type="text" required />
      </div>

      <div class="field full">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required />
      </div>

      <div class="field">
        <label for="type">Type</label>
        <select id="type" name="type" aria-controls="notesContainer" required>
          <option value="">Choose one</option>
          <option value="student">Student</option>
          <option value="guest">Guest</option>
        </select>
      </div>

      <div class="field">
        <label for="availableDate">Event Date</label>
        <input id="availableDate" name="availableDate" type="date" required />
      </div>

      <div id="notesContainer" class="field full" hidden>
        <label id="notesLabel" for="notes">Student I#</label>
        <input id="notes" name="notes" type="text" />
      </div>

      <button class="full" type="submit">Create Ticket</button>
    </form>

    <div id="errorContainer" style="color: red; margin-top: 1rem; font-weight: bold;"></div>
    <section id="output" aria-live="polite"></section>
  </main>
</body>
</html>
