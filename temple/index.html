<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Discover the temples of Idaho.">
    <meta name="author" content="Efrain Velasquez">
    <title>Temples of Idaho</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>

    <header>
        <div class="logo-container">
            <img src="images/logo.png" alt="Logo of the Page" class="logo-placeholder">
        </div>
        <nav>
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#temples-section">Temples Directory</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="home" class="hero">
            <h1>Discover Temples in Idaho State</h1>
            <div class="hero-image-placeholder">
                <img src="images/idaho.jpg" alt="Idaho Landscape" class="hero-img">
            </div>
        </section>

        <section class="search-container">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="FIND A TEMPLE NEAR YOU (City or Zip)">
                <button id="searchButton" aria-label="Search">
                    🔍
                </button>
            </div>
        </section>

        <section id="temples-section" class="featured-temples">
            <h2>FEATURED TEMPLES IN IDAHO</h2>
            <div id="templesGrid" class="temples-grid">

            </div>
        </section>
    </main>

    <div id="detailsModal" class="modal hidden">
        <div class="modal-content">
            <span id="closeModal" class="close-btn">&times;</span>
            <h3 id="modalTitle"></h3>
            <p id="modalDesc"></p>
            <p id="modalExtra" class="extra-info"></p>
        </div>
    </div>

    <footer id="footer">
        <p>Copyright &copy; 2026 Temples of Idaho</p>
    </footer>

</body>
</html>
